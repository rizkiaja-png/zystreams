<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZY STREAM — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-body: #0c0c10;
      --bg-card: #14141a;
      --bg-input: #1c1c24;
      --border-soft: rgba(255, 255, 255, 0.07);
      --text-white: #ffffff;
      --text-gray: #a1a1b2;
      --text-dim: #6e6e80;
      --accent: #ff2e63;
      --gold: #f5b041;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(12, 12, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-white);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff2e63, #9b2cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: -0.5px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-gray);
    }

    .live-indicator.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 16px rgba(255, 46, 99, 0.45);
    }

    .live-indicator.active .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulseAnim 1.4s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .viewers-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 32px 48px;
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 28px;
      align-items: start;
    }

    /* VIDEO PLAYER SECTION */
    .player-wrapper {
      width: 100%;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-soft);
    }

    .video-box video,
    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* THUMBNAIL / STANDBY COVER */
    .thumbnail-cover {
      position: absolute;
      inset: 0;
      background-color: #121218;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 36px;
      z-index: 10;
    }

    .thumbnail-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(12, 12, 16, 0.95) 5%, rgba(12, 12, 16, 0.4) 55%, rgba(12, 12, 16, 0.15) 100%);
      z-index: 1;
    }

    .thumbnail-cover.hidden {
      display: none;
    }

    .cover-info {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .cover-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(245, 176, 65, 0.18);
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .cover-title {
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .cover-subtitle {
      font-size: 0.92rem;
      color: var(--text-gray);
    }

    /* SHOW DETAILS BELOW VIDEO */
    .show-details {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .show-text {
      flex: 1;
      min-width: 0;
    }

    .event-subtitle {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .show-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    .show-desc {
      font-size: 0.92rem;
      color: var(--text-gray);
      line-height: 1.6;
      white-space: pre-line;
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
    }

    .show-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      padding-top: 24px;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-white);
      padding: 10px 16px;
      border-radius: 99px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #20202a;
      transform: translateY(-1px);
    }

    .action-btn.share {
      background: var(--text-white);
      color: #0c0c10;
      border: none;
    }

    .action-btn.share:hover {
      background: #e5e5ec;
    }

    /* LIVE CHAT CARD */
    .chat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      height: calc(100vh - 112px);
      min-height: 500px;
      max-height: 760px;
      position: sticky;
      top: 88px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .chat-sub {
      font-size: 0.74rem;
      color: var(--text-dim);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-list::-webkit-scrollbar {
      width: 5px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
    }

    .chat-placeholder {
      margin: auto;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.84rem;
      padding: 20px;
    }

    .msg-bubble {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .msg-content {
      flex: 1;
      min-width: 0;
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .msg-name {
      font-weight: 700;
      color: #e4e4ec;
      margin-right: 6px;
    }

    .msg-name.admin {
      color: var(--gold);
    }

    .badge-host {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .msg-text {
      color: #c2c2d1;
      word-break: break-word;
    }

    /* CHAT INPUT */
    .chat-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-soft);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-white);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .chat-input::placeholder {
      color: var(--text-dim);
    }

    .send-group {
      display: flex;
      gap: 8px;
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* RESPONSIVE */
    @media (max-width: 1060px) {
      .container {
        grid-template-columns: 1fr;
        padding: 16px 16px 40px;
      }
      .chat-card {
        position: static;
        height: 460px;
        max-height: none;
      }
      .show-details {
        flex-direction: column;
      }
      .show-actions {
        padding-top: 0;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 16px;
      }
      .thumbnail-cover {
        padding: 20px;
      }
      .cover-title {
        font-size: 1.25rem;
      }
      .show-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header class="header">
    <a href="#" class="brand">
      <div class="brand-icon">ZY</div>
      <span class="brand-name">ZY STREAM</span>
    </a>

    <div class="header-meta">
      <div class="live-indicator" id="live-badge">
        <span class="pulse"></span>
        <span id="live-text">OFFLINE</span>
      </div>
      <div class="viewers-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="viewer-count">0</span> menonton
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="container">
    
    <!-- VIDEO & DETAILS -->
    <div class="player-wrapper">
      <div class="video-box">
        <!-- Thumbnail / Cover sebelum live dimulai -->
        <div class="thumbnail-cover" id="thumbnail-cover">
          <div class="cover-info">
            <span class="cover-badge" id="cover-badge">Segera Tayang</span>
            <h2 class="cover-title" id="cover-title">Menunggu Siaran Dimulai</h2>
            <p class="cover-subtitle" id="cover-subtitle">Tayangan akan otomatis muncul di layar ini saat acara dimulai.</p>
          </div>
        </div>

        <video id="video-player" controls playsinline></video>
        <iframe id="iframe-player" style="display:none;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="show-details">
        <div class="show-text">
          <div class="event-subtitle" id="event-name">ZY STREAM SPECIAL</div>
          <h1 class="show-title" id="stream-title">Memuat tayangan...</h1>
          <div class="show-desc" id="stream-desc">Menghubungkan ke siaran langsung...</div>
        </div>

        <div class="show-actions">
          <button class="action-btn" onclick="refreshPlayer()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Segarkan
          </button>
          <button class="action-btn share" onclick="sharePage(this)">
            Bagikan
          </button>
        </div>
      </div>
    </div>

    <!-- LIVE CHAT -->
    <aside class="chat-card">
      <div class="chat-header">
        <h3>Live Chat</h3>
        <span class="chat-sub">Obrolan langsung</span>
      </div>

      <div class="chat-list" id="chat-list">
        <div class="chat-placeholder" id="chat-empty">Jadilah yang pertama menyapa di obrolan langsung!</div>
      </div>

      <form class="chat-footer" id="chat-form">
        <input type="text" id="user-name" class="chat-input" placeholder="Nama kamu" maxlength="24" required />
        <div class="send-group">
          <input type="text" id="user-msg" class="chat-input" placeholder="Tulis pesan..." maxlength="150" autocomplete="off" required />
          <button type="submit" class="send-btn" id="send-btn">Kirim</button>
        </div>
      </form>
    </aside>

  </div>

  <script>
    /**
     * ============================================================================
     * GANTI ID INI UNTUK MASING-MASING DARI 7 WEBSITE:
     * Website 1: "stream_1" | Website 2: "stream_2" | ... | Website 7: "stream_7"
     * ============================================================================
     */
    const SITE_ID = "stream_1";

    const firebaseConfig = {
      apiKey: "AIzaSyB_H27U5OYilSY9QCHQhUSYlE5nXvzJNMk",
      authDomain: "zystreams-network.firebaseapp.com",
      databaseURL: "https://zystreams-network-default-rtdb.firebaseio.com",
      projectId: "zystreams-network",
      storageBucket: "zystreams-network.firebasestorage.app",
      messagingSenderId: "940547124799",
      appId: "1:940547124799:web:2d94b541e3bf1d2f55528a",
      measurementId: "G-8WEY5ZB99G"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const streamRef = db.ref(`streams/${SITE_ID}/config`);
    const viewersRef = db.ref(`streams/${SITE_ID}/viewers`);
    const chatRef = db.ref(`streams/${SITE_ID}/chat`);

    const videoEl = document.getElementById("video-player");
    const iframeEl = document.getElementById("iframe-player");
    const coverEl = document.getElementById("thumbnail-cover");
    const liveBadgeEl = document.getElementById("live-badge");
    const liveTextEl = document.getElementById("live-text");
    const chatListEl = document.getElementById("chat-list");
    const chatEmptyEl = document.getElementById("chat-empty");

    let currentData = null;
    let hls = null;

    // 1. REAL-TIME JUMLAH PENONTON AKTIF
    const myPresenceRef = viewersRef.push();
    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove();
        myPresenceRef.set({ active: true, ts: firebase.database.ServerValue.TIMESTAMP });
      }
    });

    viewersRef.on("value", (snap) => {
      document.getElementById("viewer-count").textContent = snap.numChildren().toLocaleString("id-ID");
    });

    // 2. UNIVERSAL LINK RESOLVER (YouTube, Twitch, Google Drive, HLS, MP4, Iframe)
    function resolveMediaSource(rawUrl, forcedType) {
      const url = rawUrl.trim();
      const host = window.location.hostname || "localhost";

      // A. Deteksi YouTube (watch?v=, youtu.be/, live/, embed/, shorts/)
      const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return {
          mode: "iframe",
          src: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0&modestbranding=1`
        };
      }

      // B. Deteksi Twitch Video VOD (twitch.tv/videos/123456)
      const twitchVod = url.match(/twitch\.tv\/videos\/(\d+)/);
      if (twitchVod && twitchVod[1]) {
        return {
          mode: "iframe",
          src: `https://player.twitch.tv/?video=${twitchVod[1]}&parent=${host}&autoplay=true`
        };
      }

      // C. Deteksi Twitch Channel Live (twitch.tv/nama_channel)
      const twitchChan = url.match(/(?:https?:\/\/)?(?:www\.)?twitch\.tv\/([a-zA-Z0-9_]+)(?:\/)?(?:\?.*)?$/);
      if (twitchChan && twitchChan[1] && twitchChan[1].toLowerCase() !== "directory") {
        return {
          mode: "iframe",
          src: `https://player.twitch.tv/?channel=${twitchChan[1]}&parent=${host}&autoplay=true`
        };
      }

      // D. Deteksi Google Drive Video
      const gdriveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (gdriveMatch && gdriveMatch[1]) {
        return {
          mode: "iframe",
          src: `https://drive.google.com/file/d/${gdriveMatch[1]}/preview`
        };
      }

      // E. Deteksi HLS (.m3u8)
      if (forcedType === "hls" || url.toLowerCase().includes(".m3u8")) {
        return { mode: "hls", src: url };
      }

      // F. Deteksi Video Langsung (.mp4 / .webm)
      if (forcedType === "mp4" || /\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) {
        return { mode: "mp4", src: url };
      }

      // G. Default: Iframe embed lainnya (Kick, Dailymotion, Vimeo, dll)
      return { mode: "iframe", src: url };
    }

    // 3. REAL-TIME DATA SIARAN & THUMBNAIL
    streamRef.on("value", (snap) => {
      const data = snap.val();

      if (!data) {
        setStatus("OFFLINE");
        coverEl.classList.remove("hidden");
        document.getElementById("cover-badge").textContent = "Segera Tayang";
        document.getElementById("cover-title").textContent = "Siaran Belum Dimulai";
        document.getElementById("cover-subtitle").textContent = "Tunggu sebentar, tayangan akan segera hadir.";
        document.getElementById("stream-title").textContent = "ZY Stream Live";
        document.getElementById("stream-desc").textContent = "Siaran langsung akan segera dimulai.";
        stopStream();
        return;
      }

      const prevUrl = currentData ? currentData.streamUrl : "";
      const prevType = currentData ? currentData.streamType : "";
      const prevStatus = currentData ? currentData.status : "";
      currentData = data;

      document.getElementById("event-name").textContent = data.eventName || "ZY STREAM LIVE";
      document.getElementById("stream-title").textContent = data.title || "Live Broadcast";
      document.getElementById("stream-desc").textContent = data.description || "Selamat menyaksikan siaran langsung.";
      document.title = `${data.title || "Live"} — ZY STREAM`;

      if (data.thumbnailUrl && data.thumbnailUrl.trim() !== "") {
        coverEl.style.backgroundImage = `url('${data.thumbnailUrl.trim()}')`;
      } else {
        coverEl.style.backgroundImage = "none";
      }

      const status = (data.status || "STANDBY").toUpperCase();
      setStatus(status);

      if (status === "LIVE" && data.streamUrl && data.streamUrl.trim() !== "") {
        coverEl.classList.add("hidden");
        if (prevUrl !== data.streamUrl || prevType !== data.streamType || prevStatus !== "LIVE") {
          playStream(data.streamUrl.trim(), data.streamType || "auto");
        }
      } else {
        stopStream();
        coverEl.classList.remove("hidden");
        document.getElementById("cover-badge").textContent = status === "ENDED" ? "Siaran Selesai" : "Segera Tayang";
        document.getElementById("cover-title").textContent = data.title || "Siaran Akan Segera Dimulai";
        document.getElementById("cover-subtitle").textContent = status === "ENDED"
          ? "Terima kasih sudah menonton bersama di ZY Stream."
          : "Tetap di halaman ini, tayangan akan otomatis diputar saat live dimulai.";
      }
    });

    function setStatus(status) {
      if (status === "LIVE") {
        liveBadgeEl.classList.add("active");
        liveTextEl.textContent = "LIVE";
      } else {
        liveBadgeEl.classList.remove("active");
        liveTextEl.textContent = status === "ENDED" ? "SELESAI" : "STANDBY";
      }
    }

    function playStream(rawUrl, type) {
      stopStream();
      const media = resolveMediaSource(rawUrl, type);

      if (media.mode === "iframe") {
        videoEl.style.display = "none";
        iframeEl.style.display = "block";
        iframeEl.src = media.src;
      } else if (media.mode === "hls") {
        iframeEl.style.display = "none";
        videoEl.style.display = "block";

        if (Hls.isSupported()) {
          hls = new Hls({ lowLatencyMode: true });
          hls.loadSource(media.src);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = media.src;
          videoEl.play().catch(() => {});
        }
      } else {
        iframeEl.style.display = "none";
        videoEl.style.display = "block";
        videoEl.src = media.src;
        videoEl.play().catch(() => {});
      }
    }

    function stopStream() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      videoEl.style.display = "none";
      iframeEl.src = "";
      iframeEl.style.display = "none";
    }

    function refreshPlayer() {
      if (currentData && currentData.status === "LIVE" && currentData.streamUrl) {
        playStream(currentData.streamUrl.trim(), currentData.streamType || "auto");
      }
    }

    function sharePage(btn) {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const old = btn.textContent;
        btn.textContent = "Tersalin!";
        setTimeout(() => { btn.textContent = old; }, 1800);
      });
    }

    // 4. REAL-TIME LIVE CHAT + HAPUS OTOMATIS TIAP 2 MENIT
    const EXPIRE_MS = 2 * 60 * 1000;
    const shownKeys = new Set();
    const avatarColors = ["#e11d48", "#7c3aed", "#2563eb", "#059669", "#d97706", "#db2777"];

    function getAvatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return avatarColors[Math.abs(hash) % avatarColors.length];
    }

    const savedName = localStorage.getItem("zy_chat_name");
    if (savedName) document.getElementById("user-name").value = savedName;

    function cleanOldChats() {
      const limit = Date.now() - EXPIRE_MS;

      chatRef.orderByChild("timestamp").endAt(limit).once("value", (snap) => {
        if (!snap.exists()) return;
        const updates = {};
        snap.forEach((child) => { updates[child.key] = null; });
        chatRef.update(updates).catch(() => {});
      });

      chatListEl.querySelectorAll(".msg-bubble").forEach((el) => {
        if (Number(el.dataset.ts) < limit) {
          shownKeys.delete(el.dataset.key);
          el.remove();
        }
      });

      chatEmptyEl.style.display = chatListEl.querySelectorAll(".msg-bubble").length ? "none" : "block";
    }

    setInterval(cleanOldChats, 10000);

    chatRef.limitToLast(60).on("child_added", (snap) => {
      const msg = snap.val();
      const key = snap.key;
      if (!msg || shownKeys.has(key)) return;

      const ts = typeof msg.timestamp === "number" ? msg.timestamp : Date.now();
      if (ts < Date.now() - EXPIRE_MS) {
        chatRef.child(key).remove().catch(() => {});
        return;
      }

      shownKeys.add(key);

      const name = msg.name || "Penonton";
      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.dataset.key = key;
      bubble.dataset.ts = ts;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.style.backgroundColor = msg.isAdmin ? "#f5b041" : getAvatarColor(name);
      avatar.textContent = name.charAt(0).toUpperCase();

      const content = document.createElement("div");
      content.className = "msg-content";

      if (msg.isAdmin) {
        const badge = document.createElement("span");
        badge.className = "badge-host";
        badge.textContent = "HOST";
        content.appendChild(badge);
      }

      const nameEl = document.createElement("span");
      nameEl.className = `msg-name ${msg.isAdmin ? "admin" : ""}`;
      nameEl.textContent = name;

      const textEl = document.createElement("span");
      textEl.className = "msg-text";
      textEl.textContent = msg.text || "";

      content.appendChild(nameEl);
      content.appendChild(textEl);
      bubble.appendChild(avatar);
      bubble.appendChild(content);

      chatListEl.appendChild(bubble);
      chatEmptyEl.style.display = "none";
      chatListEl.scrollTop = chatListEl.scrollHeight;
    });

    chatRef.on("child_removed", (snap) => {
      shownKeys.delete(snap.key);
      const el = chatListEl.querySelector(`[data-key="${snap.key}"]`);
      if (el) el.remove();
      chatEmptyEl.style.display = chatListEl.querySelectorAll(".msg-bubble").length ? "none" : "block";
    });

    document.getElementById("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("user-name");
      const msgInput = document.getElementById("user-msg");
      const btn = document.getElementById("send-btn");

      const name = nameInput.value.trim();
      const text = msgInput.value.trim();
      if (!name || !text) return;

      localStorage.setItem("zy_chat_name", name);
      btn.disabled = true;

      chatRef.push({
        name: name,
        text: text,
        isAdmin: false,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        msgInput.value = "";
        btn.disabled = false;
        msgInput.focus();
      }).catch(() => {
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
